name: Build and Deploy OpenAI Proxy Docker Container

on:
  workflow_dispatch:

jobs:
  build-publish-worker-docker:
    name: AI Horde OpenAI Proxy Docker Container
    runs-on: ubuntu-latest
    steps:
      - name: "✔️ Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: "Build and Publish Container to Github Container Registry"
        run: |
          docker build -t ghcr.io/haidra-org/horde-openai-proxy:${{ github.ref_name }} .
          docker push ghcr.io/haidra-org/horde-openai-proxy:${{ github.ref_name }}
      - name: Inform with Discord Webhook
        uses: tsickert/discord-webhook@v5.3.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          content: "New version of AI Horde OpenAI Proxy Docker Container has been released: ghcr.io/haidra-org/horde-openai-proxy:${{ github.ref_name }}."